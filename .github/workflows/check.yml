name: Course checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-week03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/week03
      - run: pnpm test && pnpm run check && pnpm build
        working-directory: apps/week03
      - run: python3 -m unittest discover -s local/tests
      - run: python3 scripts/test-forum-content-review.py
      - run: python3 scripts/package-week03-corpus.py && node scripts/check-week03-corpus.mjs
      - run: node scripts/build-site.mjs && node scripts/check-public.mjs
