<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四讲 · 文献整理、学术阅读与个人知识系统</title><link rel="stylesheet" href="build/week04.css"><script src="bootstrap.js" defer></script><script type="module" src="build/week04.esm.js"></script></head><body><div id="app"></div><template id="deck-template"><deck-container><deck-slide slide-id="D00" header-title="文献整理、学术阅读与个人知识系统" kicker="D00 / 封面" theme="dark" notes="目的：建立本讲的问题意识——AI 压低了检索与摘要的成本，组织与引用的责任反而落回读者；先破除&quot;文件下载即知识入库&quot;的直觉。引导话术：&quot;前三周我们让模型取得材料、组织回答、返回原文检查；今天接着问之后的事——文件安安稳稳躺在库里，你说过得出它是哪个版本、从哪取得的吗？&quot;机制背景：本讲沿研究循环分八章，演示 1—9 锚定各章；封面不承载证据与数据，只立问题，D28 会带着这个问题复访三层视图。" transition="本讲围绕一个问题展开：怎样让今天留下的材料和理解进入下一次研究？"><div class="hero-lab"><div><p class="eyebrow fade-up" style="--d:0ms">人工智能赋能历史研究与写作 · 第四讲</p><h2 class="hero-title fade-up" style="--d:80ms">文献整理<br>学术阅读<br>个人知识系统</h2><p class="hero-lead fade-up" style="--d:200ms">学者的生命有限，而文献无限。<br>如何组织文献与知识，让过去的阅读进入新的问题？</p></div><div class="hero-path fade-up" style="--d:340ms"><span>找得到<span>发现</span></span><span>辨得清<span>判断</span></span><span>引得准<span>对话</span></span></div></div><div slot="footer">D00 · 封面；本讲 live 演示运行于本机种子库，来源见各页页脚。</div></deck-slide>
<deck-slide slide-id="D01" header-title="一个古老问题的新形态" kicker="D01 / 导言" theme="light" notes="目的：破除&quot;AI 时代找书已经解决、组织工作无关紧要&quot;的预期，让学生带着&quot;成本结构变了、责任没有消失&quot;的视角进入全讲。引导话术：&quot;先想一个你自己的文献库：最近一次打开其中一份 PDF，你能说出它是哪个版本、从哪个渠道取得的吗？三秒钟答得出的请举手。&quot;机制背景：三重需求是本讲的骨架，D02 给它的两千年史料、D03 给它的八条原则；三种记录是 D05（材料）、D20（理解）、D22（关系）三页的前置概念，此处首次点名。" transition="先把这个问题拆开：研究者要找到材料、辨明身份，并能准确征引。"><div class="triad-grid"><article class="triad-card" style="--delay:0ms"><div class="triad-num">01</div><h3>发现 · 找得到</h3><p>从无限的书中筛出少数能用的书。</p><div class="triad-shift"><span class="triad-from">目录与索引</span><span class="triad-arrow">→</span><span class="triad-to">搜索引擎与检索系统</span></div></article><article class="triad-card" style="--delay:80ms"><div class="triad-num">02</div><h3>判断 · 辨得清</h3><p>核对版本、作者与论证位置。</p><div class="triad-shift"><span class="triad-from">校雠与辨伪</span><span class="triad-arrow">→</span><span class="triad-to">同行评议、版本与引用关系</span></div></article><article class="triad-card" style="--delay:160ms"><div class="triad-num">03</div><h3>对话 · 引得准</h3><p>保存原话、位置与材料来历。</p><div class="triad-shift"><span class="triad-from">征引与书目</span><span class="triad-arrow">→</span><span class="triad-to">DOI、证据 URI 与修订记录</span></div></article></div><p class="takeaway">AI 改变各环节的成本；材料、理解与关系仍须分别记录。</p><div slot="footer">D01 · 框架与引文出自教案导言；案例工具模型详见 1.4 节与仓库来源清单。</div></deck-slide>
<deck-slide slide-id="D02" header-title="找书、辨书、引书：两千年的基础设施" kicker="D02 / 导言" theme="light" notes="目的：破除&quot;组织技术是检索系统时代的新发明&quot;的错觉，建立&quot;需求塑形技术&quot;的因果视角。引导话术：&quot;请在这条线上找一找：哪些节点主要被'找书'塑形？如果给刘向父子一个今天的文献管理器，他们第一个会要求的功能是什么？&quot;机制背景：时间线为 D03 八原则提供历史出处——每条原则都能在线上找到先声；D15（Lubetzky）、D16（冒号分类法）会回到这条线取史实。" transition="这些需求由来已久；看看目录、校雠与书目怎样逐步形成相应的基础设施。"><history-timeline></history-timeline><div slot="footer">D02 · 史实与引文出自教案导言及参考阅读（Blair 2010；姚名达；章学诚；Ibn al-Nadim 1970）。</div></deck-slide>
<deck-slide slide-id="D03" header-title="组织知识系统的八条原则" kicker="D03 / 导言" theme="light" notes="目的：把八原则从&quot;要背的清单&quot;转成&quot;可反复使用的取舍裁判&quot;，每条原则配一句将来能直接自问的话。引导话术：&quot;八条不要求现在记住。请只盯住第一条——以后任何一条拿不准，回到'这帮助谁找到什么'。&quot;机制背景：八原则是全讲的评价语法，D28 六方面验收与课后发放的附录二检查表都由它导出；卡上的章次标注构成全讲导航索引。" transition="历史实践可以归纳为设计原则；下面用它们判断具体记录和组织方式为何需要。"><div class="principles-grid"><a class="prin-card" href="#D28" style="--d:0ms"><span class="prin-num">1</span><h3>用户导向</h3><p>这帮助谁找到什么？</p></a><a class="prin-card" href="#D09" style="--d:60ms"><span class="prin-num">2</span><h3>内容与载体分离</h3><p>版本与副本能分别指认吗？</p></a><a class="prin-card" href="#D22" style="--d:120ms"><span class="prin-num">3</span><h3>实体与关系</h3><p>关系有类型与理由吗？</p></a><a class="prin-card" href="#D25" style="--d:180ms"><span class="prin-num">4</span><h3>词汇控制</h3><p>异称可查、首选名明确吗？</p></a><a class="prin-card" href="#D12" style="--d:240ms"><span class="prin-num">5</span><h3>标准化与互操作</h3><p>字段语义与身份能交换吗？</p></a><a class="prin-card" href="#D07" style="--d:300ms"><span class="prin-num">6</span><h3>充分、必要、简约</h3><p>每个装置承担什么功能？</p></a><a class="prin-card" href="#D16" style="--d:360ms"><span class="prin-num">7</span><h3>可演化的结构</h3><p>新对象能顺利纳入吗？</p></a><a class="prin-card" href="#D26" style="--d:420ms"><span class="prin-num">8</span><h3>可追溯与可信任</h3><p>出处、修订和回查还在吗？</p></a></div><blockquote>Books are for use. · Every reader his book. · Every book its reader.<br>Save the time of the reader. · A library is a growing organism.<cite>Ranganathan, The Five Laws of Library Science, 1931</cite></blockquote><div slot="footer">D03 · 五定律原文与出处照教案（Ranganathan 1931）；检验问句出自附录二。</div></deck-slide>
<deck-slide slide-id="D04" header-title="一个文献库的三层视图" kicker="D04 / 导言·演示1" theme="light" notes="目的：理解题录、附件与正文检索三层分别提供的研究入口。
范例引导：点击底层柱体选择文献，再进入PDF工作台查看原页；回到检索层输入关键词，点击命中回查并返回结果。
机制背景：三层共用文献身份与来源定位。题录组织文献，附件保存原件，正文检索定位可阅读的段落与页。" transition="先看原则要作用于什么：同一书库中的题录、附件和可检索正文承担不同职责。"><metadata-split navigation="layers"></metadata-split><div slot="footer">D04 · 点击三层柱体，切换书库、PDF工作台与检索</div></deck-slide>
<deck-slide slide-id="D05" header-title="条目、字段、元数据与附件" kicker="D05 / 1.1" theme="light" notes="目的：理解条目、字段、元数据与附件各自对应的界面与研究动作。
范例引导：点击条目浏览书库，再点击元数据补齐出版日期；进入文件关联，查看原件并翻页，最后返回继续编辑。
机制背景：四类实体共用同一书库与当前题录。阅读工作台保持原页、正文与修订的对应，退出后回到原界面。" transition="三层视图背后需要明确的对象和联系；从条目、字段、元数据与附件辨认它们。"><metadata-split></metadata-split><div slot="footer">D05 · 点击实体切换界面，在同一应用中编辑与阅读</div></deck-slide>
<deck-slide slide-id="D06" header-title="从检索结果回到原页" kicker="D06 / 1.1·演示2①" theme="light" notes="目的：从检索结果取得证据地址并回到所用原话。范例引导：复制一条命中的URI，再输入解析，观察原页高亮和鼠标提示。机制背景：沿持久化的文档、页、修订与文本块关系定位，引用保持所用版本。" transition="对象与联系明确以后，检验保存是否可用：从检索命中取出地址，再回到原页核对。"><metadata-split navigation="concepts" concept-page="D06"></metadata-split><div slot="footer">D06 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D07" header-title="从需求到字段：充分且必要" kicker="D07 / 1.2" theme="light" notes="目的：理解充分性和必要性由本次需求决定。范例引导：沿元需求、子需求、字段名到表单，悬停和点击字段，讨论少录与多录的后果。机制背景：示例选择姓名、出版日期和征引页码；需求改变时字段集合也随之调整。" transition="以下原则说明文献为何能够被保存和使用，自建知识系统同样需要遵循。先从需求决定哪些字段足够且必要。"><requirements-lab></requirements-lab><div slot="footer">D07 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D08" header-title="从“同一文献”到所用版本与引用位置" kicker="D08 / 1.3" theme="light" notes="目的：引用指向哪个副本、哪次文字修订？
范例引导：查看文件哈希，打开同页的当前与历史URI。
机制背景：题录年代、文件身份和正文提交时间是不同信息。 原BLAKE3、修订ID、提交日期及页影。 扫描日期没有可靠记录时保持未知；页序与印刷页码分别核对。" transition="需求决定描述到什么程度；若要核对版本和征引，就须说明实际用了哪份材料。"><metadata-split navigation="concepts" concept-page="D08"></metadata-split><div slot="footer">D08 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D09" header-title="内容与载体分离：FRBR 的四个实体层" kicker="D09 / 1.4" theme="light" notes="目的：区分作品、表达、载体表现与单件。范例引导：沿《资本论》的任一语言分支观察表达、出版版本与藏本。机制背景：用户提供的图包含一项作品、四种表达、四项载体表现与四件藏本。" transition="用作品、表达、载体表现和单件四层，为上一页的版本与副本差别安排位置。"><mermaid-diagram diagram="capital"></mermaid-diagram><div slot="footer">D09 · 作品 → 表达 → 载体表现 → 单件</div></deck-slide>
<deck-slide slide-id="D10" header-title="“同一文献”是谁：四个工具的四份答卷" kicker="D10 / 1.4·演示2②" theme="light" notes="目的：辨明同一文献的身份层，并区分正文与可重建索引。范例引导：点击复制PDF、重新扫描、换版与校对四种变化，查看题录、文档实例、文件哈希和内容修订的关系，再查看实际FTS内容、行号映射与fts5vocab词项位置，执行重建后切换前后快照。机制背景：由已提交正文重建派生层；正文单元身份与证据地址保留，FTS行号重新分配。" transition="对象层次分清之后，再区分长期保留的依据与可以重建的索引和视图。"><standalone-lab page-id="D10"></standalone-lab><div slot="footer">D10 · 独立教学实验 · 观察输入与结果</div></deck-slide>
<deck-slide slide-id="D11" header-title="字段语义：同名栏目的不同含义" kicker="D11 / 1.5" theme="light" notes="目的：区分出版来源、取得原件与衍生关系。范例引导：点击衍生说明，在本页左侧Markdown模板中填写来历与理由。机制背景：右侧示意图保持可点，独立草稿可下载并回查原页。" transition="字段不仅要有位置，也要有明确含义；先区分出版来源、取得渠道与衍生关系。"><metadata-split navigation="concepts" concept-page="D11"></metadata-split><div slot="footer">D11 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D12" header-title="标准化链：ISBD—MARC21—CSL" kicker="D12 / 1.6·演示2③" theme="light" notes="目的：同一题录怎样形成可交换、可渲染的引文？
范例引导：选择真实题录，切换课堂样式及locale，对照输出与CSL JSON。
机制背景：同一结构数据进入Fsharp.Citeproc实时渲染。 真实渲染结果及对应结构字段。 自制课堂样式明确命名；版本和页码仍由实际材料确认。" transition="含义有了约定，就能借标准跨工具交换，并用不同CSL样式呈现同一份题录。"><metadata-split navigation="concepts" concept-page="D12"></metadata-split><div slot="footer">D12 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D13" header-title="标识符与名字空间：身份与组织分离" kicker="D13 / 1.6" theme="light" notes="目的：名字空间如何维持身份与证据定位？
范例引导：输入文本URI，逐级核对文档、页、修订和块；复制到研究记录。
机制背景：合法入口可解析；不存在的文档或修订明确报错。 原ID、文档树与右侧PDF页。 rev锁定旧版正文；页面顺序与材料印刷页码还需分别记录。" transition="交换与征引需要稳定身份；用证据地址把文档、页、修订与文本块接起来。"><metadata-split navigation="concepts" concept-page="D13"></metadata-split><div slot="footer">D13 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D14" header-title="收藏、标签与两种职责" kicker="D14 / 2.1·演示3①" theme="light" notes="目的：集合、主题与工作状态各做什么？
范例引导：新建集合、加入题录、添加主题标签并用实际投影筛选。
机制背景：一条材料可进入多个集合；标签聚合取自当前库。 item_collections、tags_json及标签派生表。 保留原标签写法，类号来源须核查；工作进度可用独立状态字段。" transition="身份稳定以后，可以为同一材料建立多个入口：集合、主题和工作进度各有所用。"><metadata-split navigation="concepts" concept-page="D14"></metadata-split><div slot="footer">D14 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D15" header-title="简约：一个装置只承担一种功能" kicker="D15 / 2.2" theme="light" notes="目的：区分集合、标签与工作状态的职责。范例引导：分别点击集合与主题标签，在各自侧栏筛选同一书库。机制背景：四篇预置文献各有四至五个标签，共同标签可聚合多篇文献。" transition="入口承担不同任务，因此每种组织装置要有明确职责，便于分别调整。"><metadata-split navigation="concepts" concept-page="D15"></metadata-split><div slot="footer">D15 · Patchouli · 点击示意图切换对应操作</div></deck-slide>
<deck-slide slide-id="D16" header-title="可演化的动态结构" kicker="D16 / 2.3" theme="light" notes="目的：理解可演化的结构。范例引导：逐次加入来源笔记与关系入口，观察材料核心保持稳定。机制背景：新问题通过追加记录展开，示例独立于文献管理器。" transition="职责分清以后，还要容纳新材料与新问题；保留稳定核心，为扩展留下位置。"><standalone-lab page-id="D16"></standalone-lab><div slot="footer">D16 · 独立教学实验 · 观察输入与结果</div></deck-slide>
<deck-slide slide-id="D17" header-title="管理对象、阅读队列与集合说明" kicker="D17 / 2.4—2.6·演示3②③" theme="light" notes="目的：把当前研究步骤落实为可继续的记录。范例引导：在独立Markdown编辑器中填写模板与理由，自由增删栏目，预览、下载并沿有效证据URI回查。机制背景：草稿由本机保存；书库、题录与原文身份继续由真实文献管理操作维护。" transition="把组织能力落实到下一步：材料缺什么、读到哪里、下次怎样继续？"><markdown-lab page-id="D17"></markdown-lab><div slot="footer">D17 · 自由填写 Markdown 模板 · 预览与下载</div></deck-slide>
